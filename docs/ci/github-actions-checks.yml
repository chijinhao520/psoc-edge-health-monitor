# Template: copy to .github/workflows/checks.yml to enable GitHub Actions.
name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r dashboard/requirements.txt
      - run: python -m unittest discover -s dashboard/tests -v
